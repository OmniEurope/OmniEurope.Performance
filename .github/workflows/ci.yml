name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OmniEurope.Performance.slnx
      - name: Build
        run: dotnet build OmniEurope.Performance.slnx --configuration Release --no-restore
      - name: Tests and coverage
        # global.json runs dotnet test on Microsoft.Testing.Platform: xunit.v3 runs the suite, TrxReport
        # writes the TRX and coverlet.MTP the Cobertura report, restricted to the published library.
        run: >-
          dotnet test --project tests/OmniEurope.Performance.Tests/OmniEurope.Performance.Tests.csproj
          --configuration Release --no-build --no-progress
          --report-trx --report-trx-filename tests.trx --results-directory artifacts/coverage
          --coverlet --coverlet-output-format cobertura --coverlet-include "[OmniEurope.Performance]*"
      - name: Verify the test results exist
        # A run that wrote no result file is a failure, whatever its exit code.
        shell: pwsh
        run: |
          $trx = Get-ChildItem artifacts/coverage -Filter tests.trx -Recurse -File | Select-Object -First 1
          if (-not $trx) { throw 'The test run produced no TRX.' }
          $counters = ([xml](Get-Content $trx.FullName -Raw)).TestRun.ResultSummary.Counters
          if ([int]$counters.total -eq 0) { throw 'The TRX holds no test.' }
          if (-not (Get-ChildItem artifacts/coverage -Filter '*.cobertura*.xml' -Recurse -File)) { throw 'No Cobertura report.' }
          "Tests: $($counters.passed) passed of $($counters.total)."
      - name: Coverage floors
        shell: pwsh
        run: ./scripts/coverage-gate.ps1 -CoverageRoot artifacts/coverage -MinLine 95 -MinBranch 85
      - name: CRAP gate
        shell: pwsh
        run: ./scripts/crap-gate.ps1 -CoverageRoot artifacts/coverage
      - name: Pack
        run: dotnet pack src/OmniEurope.Performance/OmniEurope.Performance.csproj --configuration Release --no-build --output artifacts/packages
      - name: Package content
        # What a consumer receives: the library, its documentation and English texts, the README, the
        # symbols; no stylesheet, no script, no package dependency beyond the ASP.NET Core framework.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1
          $symbols = Get-ChildItem artifacts/packages/*.snupkg | Select-Object -First 1
          if (-not $package -or -not $symbols) { throw 'The package or its symbol package is missing.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($zip.Entries.FullName)
            foreach ($required in 'README.md', 'lib/net10.0/OmniEurope.Performance.dll', 'lib/net10.0/OmniEurope.Performance.xml', 'lib/net10.0/en/OmniEurope.Performance.resources.dll') {
              if ($entries -notcontains $required) { throw "Missing from the package: $required" }
            }
            $styled = @($entries | Where-Object { $_ -match '\.(css|js|mjs)$' })
            if ($styled) { throw "The package must ship no stylesheet or script: $($styled -join ', ')" }
            $reader = [IO.StreamReader]::new(($zip.Entries | Where-Object FullName -eq 'OmniEurope.Performance.nuspec').Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $dependencies = @($nuspec.package.metadata.dependencies.group | ForEach-Object { $_.dependency } | Where-Object { $_ })
          if ($dependencies) { throw "Unexpected package dependencies: $($dependencies.id -join ', ')" }
          "Package $($nuspec.package.metadata.id) $($nuspec.package.metadata.version) verified."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/packages
          if-no-files-found: error
