name: Publish NuGet

# A published GitHub release pushes to NuGet.org the very package CI validated for the release commit:
# nothing is rebuilt here. Authentication is NuGet trusted publishing (OIDC), no long-lived API key.

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Resolve the successful CI run for the release commit
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseSha = (git rev-parse HEAD).Trim()
          $response = gh api "/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$releaseSha&status=success&per_page=20" | ConvertFrom-Json
          $run = $response.workflow_runs |
            Where-Object { $_.head_sha -ceq $releaseSha -and $_.event -eq 'push' -and $_.conclusion -eq 'success' } |
            Sort-Object run_number -Descending |
            Select-Object -First 1
          if (-not $run) { throw "No successful push CI run found for release commit $releaseSha." }
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
      - name: Download the package validated by CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download '${{ steps.ci.outputs.run_id }}' --repo $env:GITHUB_REPOSITORY --name nuget-package --dir artifacts/packages
      - name: Check the version against the release tag
        id: package
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $package = Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1
          $expected = "OmniEurope.Performance.$version.nupkg"
          if (-not $package -or $package.Name -ne $expected) { throw "Expected $expected for tag $env:TAG, found $($package.Name)." }
          if (-not (Test-Path "artifacts/packages/OmniEurope.Performance.$version.snupkg")) { throw 'The symbol package is missing.' }
          "package_path=$($package.FullName)" >> $env:GITHUB_OUTPUT
      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the package and its symbols to NuGet.org
        run: dotnet nuget push '${{ steps.package.outputs.package_path }}' --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
